site_name: ProjectPy
site_description: The complete, human-friendly Python documentation platform — from your first print("hello") to writing C extensions. Covers tutorials, standard library, language reference, HOWTOs, FAQs, and developer guides. Maintained by Souhardya Das.
site_author: Souhardya Das
site_url: https://projectpy.dev/
repo_name: projectpy70/projectpy
repo_url: https://github.com/projectpy70/projectpy
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2024–2026 Souhardya Das. Released under the MIT License.

# Python version badge shown in header (update this with each release)
extra:
  python_version: "3.14"
  author:
    name: Souhardya Das
    github: https://github.com/Sdas2003810
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/projectpy70/projectpy
      name: ProjectPy on GitHub
    - icon: fontawesome/brands/github
      link: https://github.com/Sdas2003810
      name: Souhardya Das on GitHub
    - icon: fontawesome/brands/python
      link: https://python.org
      name: Python.org
  version:
    provider: mike
    default: stable

theme:
  name: material
  custom_dir: overrides
  language: en
  favicon: assets/favicon.ico
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

  font:
    text: Inter
    code: JetBrains Mono

  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - toc.follow

  icon:
    repo: fontawesome/brands/github
    logo: material/language-python

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - stylesheets/extra.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.smartsymbols
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - def_list
  - footnotes
  - abbr
  - meta
  - toc:
      permalink: true
      toc_depth: 3

plugins:
  - search:
      separator: '[\s\-\.]+'
  - minify:
      minify_html: true

